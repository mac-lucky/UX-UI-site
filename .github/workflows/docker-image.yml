name: Docker Image CI

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      app_name: ux-ui-site
      dockerhub_image: maclucky/ux-ui-site
      ghcr_image: ghcr.io/mac-lucky/ux-ui-site
      push_to_dockerhub: true
      enable_security_scan: true
      smoke_test_script: |
        docker run -d --name smoke "$SMOKE_IMAGE" && sleep 3 && docker exec smoke wget -qO- http://127.0.0.1:8080/ > /tmp/smoke.html && grep -qi '<html' /tmp/smoke.html && docker rm -f smoke
