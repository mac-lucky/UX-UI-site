name: Docker Image CI

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      app_name: ux-ui-site
      dockerhub_image: maclucky/ux-ui-site
      ghcr_image: ghcr.io/mac-lucky/ux-ui-site
      push_to_dockerhub: true
      enable_security_scan: true
      # Runs the image with the runtime restrictions a hardened pod applies, then
      # asserts what nginx serves (scripts/test-nginx.sh). The step's bash has -e
      # and pipefail; the trap prints nginx's log on a failure and removes the
      # container on any exit.
      smoke_test_script: |
        docker run -d --name smoke -p 127.0.0.1:8080:8080 \
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
          "$SMOKE_IMAGE"
        trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs smoke; docker rm -f smoke >/dev/null; exit "$rc"' EXIT
        for _ in $(seq 1 30); do
          curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
          sleep 1
        done
        scripts/test-nginx.sh http://127.0.0.1:8080
