add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Every third-party origin below is one the pages in dist/ load today, and
# scripts/test-nginx.sh fails when a page links a stylesheet or script the policy
# does not allow. Adding a CDN asset means editing this line first.
#
#   - script-src: no 'unsafe-inline'. The site's own scripts live in .js files,
#     and that includes event handlers: an onclick="..." attribute is inline
#     script too. AOS is allowed by its exact file URL.
#   - style-src: no 'unsafe-inline' either, so a style="..." attribute or a
#     <style> block in the HTML is blocked. Put the rule in the page's .css file.
#   - The cdnjs paths stop at the library, not the version: Renovate bumps the
#     versioned URLs in the HTML, and a version in this header would break the
#     page on the next bump.
#   - fonts.googleapis.com serves the CSS, fonts.gstatic.com the font files.
#     Font Awesome loads its webfonts from under its own cdnjs path.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com/aos@2.3.1/dist/aos.js; style-src 'self' https://unpkg.com/aos@2.3.1/dist/aos.css https://fonts.googleapis.com https://cdnjs.cloudflare.com/ajax/libs/font-awesome/ https://cdnjs.cloudflare.com/ajax/libs/imagehover.css/; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com/ajax/libs/font-awesome/; img-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none';" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
