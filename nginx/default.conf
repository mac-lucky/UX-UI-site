server_tokens off;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Emit relative Location headers. On (the default), nginx expands
    # `return 301 /path` into an absolute URL built from the container's own
    # scheme and listen port, so behind a TLS-terminating proxy a redirect sends
    # the client to `http://<host>:8080/...`.
    absolute_redirect off;
    port_in_redirect off;

    # add_header inheritance is all-or-nothing across levels: a location that sets
    # ANY add_header inherits NONE from here. Every location below that sets its
    # own Cache-Control must include the security headers again, or it serves
    # without CSP/HSTS/nosniff. Locations that set nothing inherit both lines.
    #
    # The short default also covers every bare `return 301`; without one the edge
    # picks its own TTL for a redirect and can keep a stale one for a long time.
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, s-maxage=60" always;

    # Images and videos have no content hash in their names, so no `immutable`:
    # a file replaced under the same name reaches returning visitors within a
    # week. Give a changed image a new filename if it has to show up sooner.
    # CSS, JS and the PDF stay on the short default because they change in place.
    #
    # No `always` on this Cache-Control, so a 404 for a missing image is not
    # cached for a week; the security headers still carry `always`.
    location ~* \.(?:png|gif|jpe?g|webp|svg|ico|webm)$ {
        # A plain miss here logs an [error] per request; try_files does not.
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/security-headers.conf;
    }

    # /index.html served a second copy of the home page at 200. Both spellings are
    # needed: the .html rule below only strips the extension, and `try_files`
    # then resolves a bare /index straight back to index.html. `$is_args$args`
    # for the same reason as the rules below.
    location = /index.html { return 301 /$is_args$args; }
    location = /index { return 301 /$is_args$args; }

    # Collapse `/page.html` onto the extensionless URL. The pages link to each
    # other with the .html spelling, so without this every page exists twice.
    #
    # Anything captured here lands in a Location header, so constrain it: a capture
    # starting `/\` would echo `Location: /\evil.com`, which WHATWG URL parsers read
    # as `//evil.com`, an off-origin, permanently cached redirect. merge_slashes
    # covers the `//` form; nothing covers backslash. No control characters either:
    # nginx matches the *decoded* URI, so `%0d` would otherwise split the header
    # block.
    #
    # The four backslashes are deliberate. The config lexer collapses each pair, so
    # `\\\\` reaches PCRE as `\\`, an escaped literal backslash. Writing `\\` leaves
    # PCRE with `\[`, which escapes the bracket and silently breaks the whole POSIX
    # class: the location then matches nothing and the guard is gone with no error.
    #
    # `$is_args$args` because `return` (unlike `rewrite`) drops the query string.
    location ~ "^(/[^/\\\\[:cntrl:]][^[:cntrl:]]*)[.]html$" { return 301 $1$is_args$args; }

    # Collapse trailing slashes onto the same URL. The site has no directory
    # index pages besides the root, so `/projects/musicapp/` matched nothing. Same
    # character constraints as above, for the same reason. Cannot match `/`.
    location ~ "^(/[^/\\\\[:cntrl:]][^[:cntrl:]]*)/$" { return 301 $1$is_args$args; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Sets no add_header of its own, so it inherits the full server-scope set.
    # `$uri/index.html` serves `/`; a directory without one is a 404, not a 403.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Cache open file descriptors and stat() results; every request here is a
    # static file, so the syscalls are most of the per-request cost. The image
    # ships about 120 files, so 1000 entries is slack, not a tuned number.
    #
    # `open_file_cache_errors on` caches negative lookups too: a file added after
    # a miss stays 404 until the entry expires. That is safe only because the web
    # root is baked into an immutable image. Do not copy it into a config that
    # serves a writable root.
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    tcp_nopush on;
    # text/html is always compressed once gzip is on; it is not listed.
    gzip on;
    # The default (off) skips compression for any request with a Via header,
    # which a proxy or CDN in front adds. gzip_vary keeps shared caches correct.
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_vary on;
}
